<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🐍 Snake 3D — IglooBot</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e17;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #ui {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px;
      pointer-events: none;
    }
    #ui > * { pointer-events: auto; }
    .title { font-size: 1.4rem; color: #7dd3fc; font-weight: 700; }
    .branding { font-size: 0.75rem; color: #475569; }
    .accent { color: #38bdf8; font-weight: 600; }
    #score-bar {
      display: flex; gap: 24px;
      font-size: 1.05rem; font-weight: 600; color: #7dd3fc;
    }
    #overlay {
      position: fixed; inset: 0; z-index: 20;
      display: flex; justify-content: center; align-items: center;
    }
    #overlay.hidden { display: none; }
    #overlay-content {
      text-align: center;
      background: rgba(10, 14, 23, 0.94);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 40px 52px;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }
    #overlay-title { font-size: 1.8rem; color: #7dd3fc; margin-bottom: 8px; }
    #overlay-msg { color: #94a3b8; font-size: 1rem; }
    #final-score { color: #38bdf8; font-size: 1.2rem; margin-top: 10px; font-weight: 600; }
    .hint {
      position: fixed; bottom: 12px; left: 0; right: 0;
      text-align: center; font-size: 0.75rem; color: #475569; z-index: 10;
    }

    /* Title Screen */
    #title-screen {
      position: fixed; inset: 0; z-index: 30;
      display: flex; justify-content: center; align-items: center;
      background: radial-gradient(ellipse at center, #0f1a2e 0%, #0a0e17 70%);
    }
    #title-screen.hidden { display: none; }
    #title-inner {
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    #title-snake-art {
      font-size: 4rem;
      margin-bottom: 8px;
      animation: bob 2s ease-in-out infinite;
    }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    #title-name {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #7dd3fc, #38bdf8, #0ea5e9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    #title-sub {
      font-size: 1rem;
      color: #64748b;
      margin-bottom: 32px;
    }
    #title-instructions {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.8;
      margin-bottom: 36px;
    }
    #title-instructions kbd {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 2px 8px;
      font-family: inherit;
      font-size: 0.85rem;
      color: #7dd3fc;
    }
    #title-start {
      font-size: 1.15rem;
      color: #7dd3fc;
      animation: pulse 1.8s ease-in-out infinite;
      cursor: pointer;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    #title-footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: #334155;
    }
    canvas { display: block; }
    .level-btn {
      background: rgba(30,41,59,0.8);
      border: 2px solid #334155;
      color: #94a3b8;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .level-btn:hover { border-color: #7dd3fc; color: #7dd3fc; }
    .level-btn.selected { border-color: #38bdf8; color: #38bdf8; background: rgba(56,189,248,0.1); }
  </style>
</head>
<body>
  <div id="ui">
    <div>
      <div class="title">🐍 Snake 3D</div>
      <div class="branding">by <span class="accent">IglooBot</span></div>
    </div>
    <div id="score-bar">
      <span>Score: <span id="score">0</span></span>
      <span>Best: <span id="high-score">0</span></span>
    </div>
  </div>
  <div id="overlay" class="hidden">
    <div id="overlay-content">
      <h2 id="overlay-title">🐍 Snake 3D</h2>
      <p id="overlay-msg">Press Space or Tap to Start</p>
      <p id="final-score"></p>
    </div>
  </div>
  <!-- Title Screen -->
  <div id="title-screen">
    <div id="title-inner">
      <div id="title-snake-art">🐍</div>
      <div id="title-name">SNAKE 3D</div>
      <div id="title-sub">by <span class="accent">IglooBot</span></div>
      <div id="title-instructions">
        <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> to move<br>
        Eat food to grow · Don't hit the walls or yourself
      </div>
      <div id="level-selector">
        <div style="color:#94a3b8;font-size:0.95rem;margin-bottom:12px;">Select Difficulty</div>
        <div style="display:flex;gap:12px;justify-content:center;">
          <button class="level-btn" data-level="easy">🟢 Easy</button>
          <button class="level-btn selected" data-level="medium">🟡 Medium</button>
          <button class="level-btn" data-level="hard">🔴 Hard</button>
        </div>
      </div>
      <div id="snake-selector" style="margin-top:20px;">
        <div style="color:#94a3b8;font-size:0.95rem;margin-bottom:12px;">Select Snake</div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          <button class="level-btn snake-btn selected" data-snake="classic">🔵 Classic</button>
          <button class="level-btn snake-btn" data-snake="fire">🔴 Fire</button>
          <button class="level-btn snake-btn" data-snake="toxic">🟢 Toxic</button>
          <button class="level-btn snake-btn" data-snake="royal">🟣 Royal</button>
          <button class="level-btn snake-btn" data-snake="gold">🟡 Gold</button>
        </div>
      </div>
      <div id="title-start" style="margin-top:24px;">⏎ Press Space or Tap to Play</div>
      <div id="title-footer">v1.1 — Best played on desktop</div>
    </div>
  </div>

  <p class="hint">Arrow keys / WASD to move</p>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module" src="game3d.js"></script>
</body>
</html>
